
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Lenticular Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      perspective: 1000px;
      overflow: hidden;
    }

    .portfolio-card {
      width: 320px;
      height: 480px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid #555;
      background: #111;
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      box-shadow: 0 20px 60px #ffffff12;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .shine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(
        115deg,
        transparent 25%,
        #ffffff18 45%,
        transparent 60%
      );
      opacity: 0.5;
      mix-blend-mode: screen;
    }

    .card-label {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px #000;
      pointer-events: none;
    }

   
.portfolio-title {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);

  color: #fff;
  font-family: Impact,charcoal,sans-serif;
  font-size: 28px;
  top: 25px;
  font-weight: 700;
  letter-spacing: 6px;
  text-align: center;
  white-space: nowrap;
}

  </style>
</head>
<body>
<h1 class="portfolio-title">ASIYA HEISENBUG</h1>

<div class="portfolio-card" id="card">
  <div class="portfolio-card" id="card">
    <canvas id="lenticular"></canvas>
    <div class="shine"></div>
    <div class="card-label">ARUA</div>
  </div>

  <script>
    const card = document.getElementById("card");
    const canvas = document.getElementById("lenticular");
    const ctx = canvas.getContext("2d");

    const photoA = new Image();
    const photoB = new Image();

    photoA.src = "photo-a.jpg";
    photoB.src = "photo-b.jpg";

    // Size of each tiny grid cell, in pixels.
    const CELL = 6;

    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;
    let animationFrame = null;

    function setupCanvas() {
      const rect = card.getBoundingClientRect();

      canvas.width = Math.round(rect.width);
      canvas.height = Math.round(rect.height);

      render();
    }

    // Prepare each photo at the exact canvas size.
    function preparePhoto(image) {
      const offscreen = document.createElement("canvas");
      offscreen.width = canvas.width;
      offscreen.height = canvas.height;

      const c = offscreen.getContext("2d");

      // Crop the photo to fill the card without stretching it.
      const scale = Math.max(
        canvas.width / image.width,
        canvas.height / image.height
      );

      const width = image.width * scale;
      const height = image.height * scale;
      const x = (canvas.width - width) / 2;
      const y = (canvas.height - height) / 2;

      c.drawImage(image, x, y, width, height);
      return offscreen;
    }

   
function render() {
  if (
    !photoA.complete || !photoB.complete ||
    !photoA.naturalWidth || !photoB.naturalWidth
  ) return;

  const a = preparePhoto(photoA);
  const b = preparePhoto(photoB);

  const w = canvas.width;
  const h = canvas.height;

  // At the center, show Photo A.
  // Tilting either direction moves the transition forward.
  const progress = Math.abs(mouseX);

  ctx.clearRect(0, 0, w, h);

  // Reveal B in narrow vertical strips from the
  // side toward the opposite edge.
  const stripWidth =4;
  const revealWidth = progress * w;
  const fromLeft = mouseX < 0;

  ctx.drawImage(a, 0, 0);

  for (let x = 0; x < w; x += stripWidth) {
    const distance = fromLeft ? x : w - x;
    const stripProgress = Math.max(
      0,
      Math.min(1, (revealWidth - distance) / 24)
    );

    if (stripProgress > 0) {
      ctx.globalAlpha = stripProgress;
      ctx.drawImage(
        b,
        x, 0, Math.min(stripWidth, w - x), h,
        x, 0, Math.min(stripWidth, w - x), h
      );
      ctx.globalAlpha = 1;
    }
  }

  // Fine lenticular ridges.
  ctx.fillStyle = "#00000012";
  for (let x = 0; x < w; x += 3) {
    ctx.fillRect(x, 0, 1, h);
  }
}

function animate() {
  mouseX += (targetX - mouseX) * 0.12;
  mouseY += (targetY - mouseY) * 0.12;

  card.style.transform =
    `rotateY(${mouseX * 18}deg) rotateX(${-mouseY * 10}deg)`;

  render();

  if (
    Math.abs(targetX - mouseX) > 0.002 ||
    Math.abs(targetY - mouseY) > 0.002
  ) {
    animationFrame = requestAnimationFrame(animate);
  } else {
    animationFrame = null;
  }
}


    function updatePointer(clientX, clientY) {
      const rect = card.getBoundingClientRect();

      // Normalize mouse coordinates from -1 to +1.
      targetX = Math.max(-1, Math.min(
        1, ((clientX - rect.left) / rect.width) * 2 - 1
      ));

      targetY = Math.max(-1, Math.min(
        1, ((clientY - rect.top) / rect.height) * 2 - 1
      ));

      if (!animationFrame) {
        animationFrame = requestAnimationFrame(animate);
      }
    }

    card.addEventListener("pointermove", (event) => {
      updatePointer(event.clientX, event.clientY);
    });

    card.addEventListener("pointerleave", () => {
      targetX = 0;
      targetY = 0;

      if (!animationFrame) {
        animationFrame = requestAnimationFrame(animate);
      }
    });

    photoA.onload = setupCanvas;
    photoB.onload = setupCanvas;

    window.addEventListener("resize", setupCanvas);
  </script>
</body>
</html>
